services:
  scanner:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scanner-reports:/data/reports
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  scanner-reports:
